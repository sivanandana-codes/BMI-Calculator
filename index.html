<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bmi-container">
    <marquee><h1>BMI Calculator</h1></marquee>
    <p class="subtitle">Your personal health companion</p>

    <form id="bmiForm">
        <label for="Name">Full Name</label>
        <input type="text" id="Name"
               placeholder="Enter your name" required>

        <label for="Age">Age</label>
        <input type="number" id="Age"
               placeholder="Enter your age" required>

        <label for="Gender">Gender</label>
        <select id="Gender" required>
            <option value="" disabled selected>Select your gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
            <option value="Prefer not to say">Prefer not to say</option>
        </select>

        <label for="Phno">Phone Number</label>
        <input type="tel" id="Phno"
               placeholder="Enter your phone number">

        <label for="Weight">Weight (kg)</label>
        <input type="number" id="Weight"
               placeholder="Enter weight in kg" required>

        <label for="Height">Height (cm)</label>
        <input type="number" id="Height"
               placeholder="Enter height in cm" required>

        <button type="button" onclick="checkBMI()">Calculate BMI</button>
        <script src="./script.js"></script>
    </form>
    <p class="note">Small steps toward a healthier you.</p>
    </body>
    </div>
